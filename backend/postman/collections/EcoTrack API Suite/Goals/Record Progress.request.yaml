$kind: http-request
method: POST
url: '{{baseUrl}}/api/goals/{{goalId}}/progress'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{jwtToken}}'
body:
  type: json
  content: |-
    {
      "progressValue": 10.0,
      "notes": "Completed first 10 days successfully."
    }
order: 1400
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', function () {
        pm.response.to.have.status(201);
      });
      let json = pm.response.json();
      pm.test('Response contains valid fields', function () {
        pm.expect(json).to.have.property('id');
        pm.expect(json).to.have.property('goalId');
        pm.expect(json).to.have.property('progressValue', 10.0);
        pm.expect(json).to.have.property('notes');
        pm.expect(json).to.have.property('recordedAt');
      });
