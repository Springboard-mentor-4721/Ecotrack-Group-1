<div class="position-relative mb-3">
  <div class="position-absolute top-50 start-0 translate-middle-y ms-3 ch-text-neutral opacity-50">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
  </div>
  <input type="text" 
         class="form-control form-control-lg bg-light border-0 ps-5 fs-6" 
         placeholder="Search by name or type..."
         [ngModel]="searchText"
         (ngModelChange)="onSearchChange($event)"
         [disabled]="isLoading"
         aria-label="Search current page">
  <button *ngIf="searchText" 
          class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-1 text-muted" 
          [disabled]="isLoading"
          (click)="clearSearch()">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </button>
</div>
