<div class="gallery-container">
  
  <div class="gallery-sidebar">
    <h3 class="sidebar-title">Categories</h3>
    <div class="filter-list">
      <div class="filter-item active">All Templates</div>
      <div class="filter-item">Transportation</div>
      <div class="filter-item">Energy</div>
      <div class="filter-item">Water</div>
      <div class="filter-item">Waste</div>
    </div>
    
    <h3 class="sidebar-title">Tracking Type</h3>
    <div class="filter-list">
      <div class="filter-item">Automatic</div>
      <div class="filter-item">Hybrid</div>
      <div class="filter-item">Manual</div>
    </div>
  </div>

  <div class="gallery-main">
    <div class="header">
      <h1>Template Gallery</h1>
      <p>Select a template to start building your campaign.</p>
    </div>

    <div class="template-grid">
      <div class="card" 
           *ngFor="let tpl of templates" 
           (click)="onSelect(tpl)"
           [class.selected]="selectedTemplate?.id === tpl.id"
           style="background: var(--ch-color-bg-card); border-radius: var(--ch-radius-lg); box-shadow: var(--ch-shadow-card); padding: var(--ch-spacing-lg); cursor: pointer; display: flex; flex-direction: column; gap: var(--ch-spacing-sm);">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
          <h3 class="card-title" style="font-size: 16px; font-weight: 600; color: var(--ch-color-text-main); margin: 0;">{{ tpl.title }}</h3>
          <span class="card-type" style="font-size: 12px; background: var(--ch-color-primary-light); color: var(--ch-color-primary-hover); padding: 4px 8px; border-radius: var(--ch-radius-full); font-weight: 500;">{{ tpl.trackingMethod }}</span>
        </div>
        <p class="card-description" style="font-size: 14px; color: var(--ch-color-text-muted); line-height: 1.4; margin: 0; flex-grow: 1;">{{ tpl.description }}</p>
        <div class="card-meta" style="display: flex; gap: var(--ch-spacing-md); margin-top: var(--ch-spacing-sm); padding-top: var(--ch-spacing-md); border-top: 1px solid var(--ch-color-border);">
          <div class="meta-item" style="display: flex; flex-direction: column; gap: 2px;">
            <span class="meta-label" style="font-size: 11px; text-transform: uppercase; color: var(--ch-color-text-muted); font-weight: 600; letter-spacing: 0.5px;">Reward</span>
            <span class="meta-value" style="font-size: 14px; color: var(--ch-color-text-main); font-weight: 500;">{{ tpl.rewardXp }} XP</span>
          </div>
          <div class="meta-item" style="display: flex; flex-direction: column; gap: 2px;">
            <span class="meta-label" style="font-size: 11px; text-transform: uppercase; color: var(--ch-color-text-muted); font-weight: 600; letter-spacing: 0.5px;">Target</span>
            <span class="meta-value" style="font-size: 14px; color: var(--ch-color-text-main); font-weight: 500;">{{ tpl.targetValue }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
