$kind: http-request
method: GET
url: "{{baseUrl}}/api/admin/users/{{userId}}"
headers:
  - key: Authorization
    value: Bearer {{jwtToken}}
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.eql(200);
      });
