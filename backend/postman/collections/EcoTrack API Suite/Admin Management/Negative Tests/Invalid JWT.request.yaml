$kind: http-request
method: GET
url: "{{baseUrl}}/api/admin/users"
headers:
  - key: Authorization
    value: ""
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
        pm.expect(pm.response.code).to.eql(401);
      });
