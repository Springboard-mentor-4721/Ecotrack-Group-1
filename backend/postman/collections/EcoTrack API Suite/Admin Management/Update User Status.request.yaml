$kind: http-request
method: PUT
url: "{{baseUrl}}/api/admin/users/{{userId}}/status"
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{jwtToken}}
body:
  type: json
  content: |-
    {
      "status": "SUSPENDED"
    }
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.eql(200);
      });

      pm.test('Status is updated', function () {
        const res = pm.response.json();
        pm.expect(res.status).to.eql('SUSPENDED');
      });
