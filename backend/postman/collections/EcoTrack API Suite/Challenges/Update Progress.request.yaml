$kind: http-request
method: PUT
url: '{{baseUrl}}/api/challenges/1/progress'
headers:
  - key: Authorization
    value: 'Bearer {{jwtToken}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: raw
  raw: '{
  "progress": 10
}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201, 204]);
      });
