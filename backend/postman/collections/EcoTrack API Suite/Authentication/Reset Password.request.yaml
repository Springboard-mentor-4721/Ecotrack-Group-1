$kind: http-request
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "newpassword123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is success', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400]);
      });

      pm.test('Response time is under 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(10000);
      });

      const contentType = (pm.response.headers.get('Content-Type') || '').toLowerCase();
      pm.test('Response content type is JSON', function () {
        pm.expect(contentType).to.include('application/json');
      });

      const json = pm.response.json();
      pm.test('Response contains a message', function () {
        pm.expect(json.message || (json.errors && json.errors.error)).to.exist;
      });
    language: text/javascript
order: 6000
