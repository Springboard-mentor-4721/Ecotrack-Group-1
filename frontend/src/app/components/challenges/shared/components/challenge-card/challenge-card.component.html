<div class="card-premium h-100 p-3 d-flex flex-column position-relative transition-all hover-shadow bg-white border rounded-4 group"
     style="cursor: pointer;"
     [routerLink]="['/challenges', challenge.id]">
  
  <div class="rounded-3 position-relative mb-3 w-100 overflow-hidden" 
       [style.background]="'url(' + (challenge.imageUrl | challengeImage: challenge.id) + ') center/cover'" 
       style="height: 160px;"
       role="img"
       [attr.aria-label]="challenge.title + ' cover image'">
    <!-- Badges overlay -->
    <div class="position-absolute top-0 start-0 m-2">
      <div class="badge shadow-sm"
           style="backdrop-filter: blur(8px); background-color: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3);"
           [ngClass]="challenge.challengeEvaluationType === 'ACHIEVEMENT' ? 'text-white' : 'text-warning'">
        {{ challenge.challengeEvaluationType }}
      </div>
    </div>
    <div class="position-absolute top-0 end-0 m-2">
      <div class="badge shadow-sm d-flex align-items-center gap-1"
           style="backdrop-filter: blur(8px); background-color: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3);"
           [ngClass]="challenge.trackingMethod === 'AUTOMATIC' ? 'text-info' : 'text-emerald'">
        <svg *ngIf="challenge.trackingMethod === 'AUTOMATIC'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <svg *ngIf="challenge.trackingMethod !== 'AUTOMATIC'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
        {{ challenge.trackingMethod === 'AUTOMATIC' ? 'AUTO' : 'MANUAL' }}
      </div>
    </div>
  </div>

  <h3 class="fw-bold text-dark mb-2 fs-6 text-truncate pe-2">{{ challenge.title }}</h3>
  
  <div class="d-flex align-items-center gap-2 mb-2">
    <span class="badge ch-bg-neutral bg-opacity-10 ch-text-neutral border border-secondary border-opacity-25">{{ challenge.typeCode }}</span>
    <span class="fs-xs fw-bold ch-text-xp d-flex align-items-center gap-1 ms-auto">
      <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      {{ challenge.rewardXp }} XP
    </span>
  </div>

  <p class="fs-xs text-muted mb-4 flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
    {{ challenge.description }}
  </p>

  <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
    <div class="d-flex align-items-center gap-1 text-muted fs-xs">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <span [ngClass]="{'ch-text-danger fw-bold': isUrgent, 'ch-text-warning fw-bold': isWarning}">
        {{ daysRemaining > 0 ? daysRemaining + 'd left' : 'Expired' }}
      </span>
    </div>
    
    <button class="btn btn-primary btn-sm rounded-pill px-3 fw-bold fs-xs shadow-sm group-hover-scale transition-all">
      Details
    </button>
  </div>
</div>
