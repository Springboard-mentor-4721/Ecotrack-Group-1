$kind: http-request
url: "{{baseUrl}}/api/carbon"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{jwtToken}}
body:
  type: json
  content: |-
    {
      "categoryId": 1,
      "subType": "car",
      "quantity": -5,
      "unit": "km",
      "entryDate": "2026-07-14"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400', function () {
        pm.expect(pm.response.code).to.eql(400);
      });
    language: text/javascript
order: 1000
