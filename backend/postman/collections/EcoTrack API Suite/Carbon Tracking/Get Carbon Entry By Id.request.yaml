$kind: http-request
method: GET
url: '{{baseUrl}}/api/carbon/:id'
headers:
  - key: Authorization
    value: 'Bearer {{jwtToken}}'
pathVariables:
  - key: id
    value: '{{carbonEntryId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.eql(200);
      });

      pm.test('Response time is under 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      const contentType = (pm.response.headers.get('Content-Type') || '').toLowerCase();
      pm.test('Response content type is JSON', function () {
        pm.expect(contentType).to.include('application/json');
      });

      const json = pm.response.json();
      pm.test('Response contains carbon entry id', function () {
        pm.expect(json.id).to.exist;
      });

      if (json.id !== undefined) {
        pm.collectionVariables.set('carbonEntryId', String(json.id));
      }
