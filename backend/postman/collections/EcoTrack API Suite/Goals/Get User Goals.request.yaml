$kind: http-request
url: "{{baseUrl}}/api/goals?page=0&size=10"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
queryParams:
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
