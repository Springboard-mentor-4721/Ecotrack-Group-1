$kind: http-request
method: POST
url: "{{baseUrl}}/api/auth/register"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "test@example.com",
      "password": "password123"
    }
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 400', function () {
        pm.expect(pm.response.code).to.eql(400);
      });
