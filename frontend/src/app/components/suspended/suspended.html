<div class="suspended-container d-flex align-items-center justify-content-center min-vh-100 bg-surface-light">
  <div class="suspended-card bg-surface rounded-4 p-5 text-center shadow-lg border animate-fade-in" style="max-width: 500px; width: 100%;">
    
    <div class="icon-circle bg-danger bg-opacity-10 text-danger mx-auto mb-4 d-flex align-items-center justify-content-center rounded-circle" style="width: 80px; height: 80px;">
      <i class="bi bi-shield-lock-fill fs-1"></i>
    </div>
    
    <h2 class="fw-bold text-dark mb-3">Account Suspended</h2>
    <p class="text-muted mb-4 fs-6">
      Your account has been suspended by an administrator. Please contact your administrator if you believe this is a mistake.
    </p>
    
    <div class="d-flex flex-column gap-3">
      <a routerLink="/profile" class="btn btn-primary btn-lg rounded-pill fw-bold">
        Go to Profile
      </a>
      <button (click)="logout()" class="btn btn-outline-danger btn-lg rounded-pill fw-bold">
        Logout
      </button>
    </div>
  </div>
</div>
