$kind: http-request
method: GET
url: '{{baseUrl}}/api/users/me'
headers:
  - key: Authorization
    value: 'Bearer {{jwtToken}}'
order: 1500
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.eql(200);
      });

      const res = pm.response.json();
      pm.test('Response contains a profile object', function () {
        pm.expect(res).to.be.an('object');
      });

      pm.test('Response contains an identifier field', function () {
        pm.expect(res.id || res.userId || res.email).to.exist;
      });
