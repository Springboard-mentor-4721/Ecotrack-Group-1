$kind: http-request
url: "{{baseUrl}}/api/admin/users/{{userId}}"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.eql(200);
      });
    language: text/javascript
order: 5000
