$kind: http-request
url: "{{baseUrl}}/api/goals/{{goalId}}"
method: DELETE
headers:
  Authorization: Bearer {{jwtToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 204', function () {
        pm.response.to.have.status(204);
      });
    language: text/javascript
order: 7000
