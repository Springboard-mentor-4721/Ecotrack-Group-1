$kind: http-request
url: "{{baseUrl}}/api/goals"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{jwtToken}}
body:
  type: json
  content: |-
    {
      "goalType": "REDUCE_PLASTIC_USAGE",
      "title": "Zero Plastic Month",
      "description": "Avoid all single-use plastics",
      "targetValue": 30.0,
      "unit": "Days",
      "targetDate": "2027-12-31"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () {
        pm.response.to.have.status(201);
      });
      let json = pm.response.json();
      if (json && json.id) {
        pm.collectionVariables.set('goalId', String(json.id));
      }
    language: text/javascript
order: 1000
