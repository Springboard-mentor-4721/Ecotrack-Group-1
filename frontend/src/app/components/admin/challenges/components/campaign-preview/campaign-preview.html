<div class="preview-card" *ngIf="challengeForm">
  <div class="preview-header">
    <h4 class="preview-title">{{ title }}</h4>
    <span class="preview-badge">{{ sustainabilityGroup }}</span>
  </div>
  <div class="preview-body">
    <p class="preview-description">{{ description }}</p>
    
    <div class="preview-stats">
      <div class="stat-item">
        <span class="stat-label">Reward</span>
        <span class="stat-value">{{ rewardXp }} XP</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Duration</span>
        <span class="stat-value">{{ durationDays }} Days</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Tracking</span>
        <span class="stat-value">{{ trackingMethod }}</span>
      </div>
      <div class="stat-item" *ngIf="trackingMethod === 'AUTOMATIC' || trackingMethod === 'HYBRID'">
        <span class="stat-label">Rules</span>
        <span class="stat-value">{{ allowedRulesCount }} Allowed / {{ blockedRulesCount }} Blocked</span>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <span>Progress Target</span>
        <span>0 / {{ targetValue }}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>
</div>
