$kind: http-request
method: DELETE
url: "{{baseUrl}}/api/goals/{{goalId}}"
headers:
  - key: Authorization
    value: Bearer {{jwtToken}}
order: 1600
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 204', function () {
        pm.response.to.have.status(204);
      });
