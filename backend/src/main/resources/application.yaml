spring:
  config:
    import: optional:file:.env[.properties]
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  application:
    name: ecotrack-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecotrack_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      spring:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope:
              - openid
              - profile
              - email
jwt:
  # 256-bit Base64 Key for signing JWTs
  secret: ${JWT_SECRET:}
  # Token expiration time in milliseconds (1 day = 86400000)
  expiration: 86400000

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
