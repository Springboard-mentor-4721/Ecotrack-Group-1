$kind: http-request
url: "{{baseUrl}}/api/unknown-endpoint"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404 Not Found', function () {
        pm.expect(pm.response.code).to.eql(404);
      });
    language: text/javascript
order: 5000
