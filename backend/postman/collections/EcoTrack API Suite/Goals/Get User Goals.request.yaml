$kind: http-request
method: GET
url: "{{baseUrl}}/api/goals?page=0&size=10"
headers:
  - key: Authorization
    value: Bearer {{jwtToken}}
order: 1100
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
