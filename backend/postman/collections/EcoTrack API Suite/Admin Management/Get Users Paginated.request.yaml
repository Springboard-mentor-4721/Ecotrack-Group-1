$kind: http-request
url: "{{baseUrl}}/api/admin/users?page=0&size=10"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
queryParams:
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.eql(200);
      });

      pm.test('Response is a paginated list', function () {
        const res = pm.response.json();
        pm.expect(res).to.have.property('content');
        pm.expect(res).to.have.property('pageable');
      });
    language: text/javascript
order: 2000
