$kind: http-request
method: GET
url: '{{baseUrl}}/api/goals/{{goalId}}/analytics'
headers:
  - key: Authorization
    value: 'Bearer {{jwtToken}}'
order: 1500
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
