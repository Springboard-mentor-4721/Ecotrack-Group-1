$kind: http-request
url: "{{baseUrl}}/api/goals/{{goalId}}/analytics"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
