<!-- Action Panel (If Not Joined) -->
<div *ngIf="!challenge.userProgress" class="bg-white border-0 rounded-4 p-5 shadow-sm h-100 d-flex flex-column align-items-center justify-content-center text-center transition-all hover-shadow-lg position-relative overflow-hidden">
  <div class="position-absolute top-0 end-0 bg-emerald opacity-10 rounded-circle translate-middle" style="width: 300px; height: 300px; pointer-events: none;"></div>
  
  <div class="bg-emerald bg-opacity-10 text-emerald rounded-circle p-4 mb-4 position-relative z-1 border border-emerald border-opacity-25 shadow-sm">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
  </div>
  <h3 class="fw-bolder text-dark mb-3 position-relative z-1">Ready to make an impact?</h3>
  <p class="text-muted mb-5 fs-sm max-w-sm position-relative z-1 lh-base">Join this challenge, log your actions daily, and earn rewards for your contribution to a better planet.</p>
  
  <button class="btn btn-emerald rounded-pill py-3 px-5 fw-bold shadow-sm position-relative z-1 w-100 fs-5 transition-all hover-shadow-lg hover-translate-up group"
          (click)="joinClicked.emit()"
          [disabled]="isActionLoading || challenge.status !== 'ACTIVE'">
    <span *ngIf="isActionLoading" class="spinner-border spinner-border-sm me-2"></span>
    {{ challenge.status === 'ACTIVE' ? 'Accept Challenge' : 'Not Available' }}
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ms-2 transition-all group-hover-translate-x"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </button>
</div>

<!-- Your Progress (Only if Joined) -->
<div *ngIf="challenge.userProgress" class="bg-white border-0 rounded-4 p-5 shadow-sm h-100 d-flex flex-column transition-all hover-shadow-lg">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bolder text-dark mb-0 fs-3 d-flex align-items-center gap-2">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-emerald"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      Your Progress
    </h4>
    <app-challenge-status-badge [status]="challenge.userProgress.status" size="md"></app-challenge-status-badge>
  </div>
  
  <!-- Sub-components for Progress UI -->
  <app-achievement-progress 
    *ngIf="challenge.challengeEvaluationType !== 'BUDGET'"
    [progress]="challenge.userProgress.progress"
    [target]="challenge.targetValue"
    [unit]="challenge.rulesConfig?.unit || ''"
    variant="full"
    class="mb-4 d-block">
  </app-achievement-progress>

  <app-budget-progress 
    *ngIf="challenge.challengeEvaluationType === 'BUDGET'"
    [progress]="challenge.userProgress.progress"
    [target]="challenge.targetValue"
    [unit]="challenge.rulesConfig?.unit || ''"
    [challengeStartDate]="challenge.startDate"
    [challengeEndDate]="challenge.endDate"
    variant="full"
    class="mb-4 d-block">
  </app-budget-progress>
  
  <div class="row g-3 mb-4 mt-1">
    <div class="col-12">
      <div class="bg-blue bg-opacity-10 rounded-4 p-3 border border-blue border-opacity-25 text-center h-100">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue mb-2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span class="fs-xs text-blue d-block fw-bolder text-uppercase tracking-wide mb-1">XP Reward on Completion</span>
        <span class="fs-4 fw-bolder text-dark">{{ challenge.rewardXp }} XP</span>
      </div>
    </div>
  </div>

  <button *ngIf="challenge.trackingMethod !== 'AUTOMATIC'" class="btn btn-emerald rounded-pill py-3 px-4 fw-bolder w-100 shadow-sm mt-auto fs-5 transition-all hover-shadow-lg" (click)="logProgressClicked.emit()">
    Log Today's Impact
  </button>
  
  <div *ngIf="challenge.trackingMethod === 'AUTOMATIC'" class="bg-emerald bg-opacity-10 text-emerald rounded-pill py-3 px-4 fw-bolder text-center w-100 mt-auto fs-sm border border-emerald border-opacity-25 d-flex align-items-center justify-content-center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
    Automatic Tracking Enabled
  </div>
</div>
