<div class="card-premium h-100">
  <div class="d-flex align-items-center mb-4">
    <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-2 me-3">
      <i class="lucide-trophy" style="width: 24px; height: 24px;"></i>
    </div>
    <h3 class="fs-4 fw-bold mb-0">Top Participants</h3>
  </div>

  <div *ngIf="isLoading" class="d-flex flex-column gap-3">
    <div *ngFor="let i of [1,2,3,4,5]" class="d-flex align-items-center skeleton-row">
      <div class="skeleton-avatar rounded-circle me-3"></div>
      <div class="flex-grow-1">
        <div class="skeleton-text w-50 mb-2"></div>
        <div class="skeleton-text w-25"></div>
      </div>
    </div>
  </div>

  <div *ngIf="hasError && !isLoading" class="text-center py-4 text-muted">
    <i class="lucide-alert-circle mb-2" style="width: 24px; height: 24px;"></i>
    <p class="mb-0 fs-sm">Failed to load leaderboard. Please try again later.</p>
  </div>

  <div *ngIf="!isLoading && !hasError && participants.length === 0" class="text-center py-4 text-muted">
    <i class="lucide-users mb-2" style="width: 24px; height: 24px;"></i>
    <p class="mb-0 fs-sm">No participants yet. Be the first to join!</p>
  </div>

  <div *ngIf="!isLoading && !hasError && participants.length > 0" class="d-flex flex-column gap-3">
    <div *ngFor="let p of participants; let i = index" class="d-flex align-items-center p-2 rounded transition-all hover-bg">
      <div class="rank-badge fw-bold text-center me-3" [ngClass]="{'rank-1': i === 0, 'rank-2': i === 1, 'rank-3': i === 2}">
        {{ i + 1 }}
      </div>
      <div class="d-flex flex-column flex-grow-1">
        <span class="fw-bold fs-sm">{{ p.userName || ('User #' + p.userId) }}</span>
        <span class="text-muted fs-xs">{{ p.progress }} {{ challengeUnit }}</span>
        <span *ngIf="p.status === 'COMPLETED' && p.completedAt" class="text-muted fs-xs">Completed: {{ p.completedAt | date:'mediumDate' }}</span>
      </div>
      <app-challenge-status-badge [status]="p.status" size="sm"></app-challenge-status-badge>
    </div>
  </div>
</div>
