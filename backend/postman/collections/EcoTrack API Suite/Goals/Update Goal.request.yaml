$kind: http-request
url: "{{baseUrl}}/api/goals/{{goalId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{jwtToken}}
body:
  type: json
  content: |-
    {
      "goalType": "REDUCE_PLASTIC_USAGE",
      "title": "Zero Plastic Month (Updated)",
      "description": "Avoid all single-use plastics completely",
      "targetValue": 31.0,
      "unit": "Days",
      "targetDate": "2027-12-31"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
