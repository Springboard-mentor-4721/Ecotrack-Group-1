$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "test@example.com",
      "password": "wrongpassword"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401', function () {
        pm.expect(pm.response.code).to.eql(401);
      });
    language: text/javascript
order: 1000
