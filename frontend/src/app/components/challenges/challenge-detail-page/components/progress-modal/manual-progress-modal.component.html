<div class="modal fade show" tabindex="-1" *ngIf="isVisible" style="display: block; background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px);" role="dialog" aria-modal="true" aria-labelledby="progressModalTitle">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-5 border-0 shadow-premium overflow-hidden bg-glass">
      
      <div class="modal-header border-0 bg-gradient-premium p-4 p-md-5 pb-4">
        <div>
          <h5 class="modal-title fw-bolder text-white fs-3 mb-1" id="progressModalTitle">
            <i class="lucide-zap me-2"></i>Log Your Progress
          </h5>
          <p class="mb-0 text-white-50 fs-sm">{{ challenge?.title }}</p>
        </div>
        <button type="button" class="btn-close btn-close-white rounded-circle p-3 shadow-sm bg-dark bg-opacity-25 hover-scale" aria-label="Close" (click)="close.emit()"></button>
      </div>
      
      <div class="modal-body p-4 p-md-5">
        
        <!-- COUNT Type Modal Options -->
        <div *ngIf="challenge?.progressMetric === 'ENTRY_COUNT'">
          <div class="text-center mb-5">
            <h4 class="fw-bold text-dark mb-2">Awesome Work!</h4>
            <p class="text-muted fs-5">How many entries would you like to log?</p>
          </div>

          <div class="d-flex justify-content-center gap-4 mb-5">
            <button class="btn btn-premium-action quick-add-btn flex-grow-1" (click)="submitQuickCount(1)" [disabled]="isActionLoading">
              <span class="fs-2 fw-bolder">+1</span>
              <span class="fs-6 d-block opacity-75 mt-1">Quick Add</span>
            </button>
            <button class="btn btn-premium-action quick-add-btn flex-grow-1" (click)="submitQuickCount(5)" [disabled]="isActionLoading">
              <span class="fs-2 fw-bolder">+5</span>
              <span class="fs-6 d-block opacity-75 mt-1">Quick Add</span>
            </button>
          </div>

          <div class="position-relative text-center mb-5">
            <hr class="text-muted opacity-25">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted fs-sm fw-bold">OR CUSTOM AMOUNT</span>
          </div>

          <div class="d-flex flex-column flex-sm-row align-items-center gap-3">
            <input type="number" class="form-control form-control-premium w-100" 
                   [ngModel]="customAmount" (ngModelChange)="onAmountChange($event)" 
                   placeholder="Enter custom amount..." min="1" [disabled]="isActionLoading">
            <button class="btn btn-premium-submit w-100 w-sm-auto px-5" 
                    (click)="onSubmit()" 
                    [disabled]="!isValid || isActionLoading">
              <span *ngIf="isActionLoading" class="spinner-border spinner-border-sm me-2"></span>
              <span *ngIf="!isActionLoading">Confirm <i class="lucide-check ms-1"></i></span>
            </button>
          </div>
        </div>

        <!-- AMOUNT Type Modal -->
        <div *ngIf="challenge?.progressMetric === 'QUANTITY' || challenge?.progressMetric === 'CARBON_EMISSION'">
          <div class="text-center mb-5">
            <div class="icon-pulse-container mb-4">
              <div class="icon-pulse bg-gradient-premium rounded-circle d-inline-flex p-4 shadow-premium">
                <i class="lucide-trending-up text-white" style="width: 32px; height: 32px;"></i>
              </div>
            </div>
            <h4 class="fw-bold text-dark mb-2">Track Your Impact</h4>
            <p class="text-muted fs-5">Enter the amount you achieved.</p>
          </div>
          
          <div class="mb-5">
            <label class="form-label fw-bold text-dark fs-sm ms-3 text-uppercase tracking-wide">Amount Achieved</label>
            <div class="input-group input-group-premium">
              <input type="number" class="form-control form-control-premium border-0" 
                     [ngModel]="customAmount" (ngModelChange)="onAmountChange($event)" 
                     placeholder="0.00" min="0.01" step="0.01" [disabled]="isActionLoading">
              <span class="input-group-text bg-light text-muted fw-bold px-4">Units</span>
            </div>
          </div>
          
          <div class="d-flex flex-column flex-sm-row gap-3">
            <button class="btn btn-light btn-premium-cancel flex-grow-1" 
                    (click)="cancel.emit()" [disabled]="isActionLoading">
              Cancel
            </button>
            <button class="btn btn-premium-submit flex-grow-1" 
                    (click)="onSubmit()"
                    [disabled]="!isValid || isActionLoading">
              <span *ngIf="isActionLoading" class="spinner-border spinner-border-sm me-2"></span>
              <span *ngIf="!isActionLoading">Submit Progress</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
