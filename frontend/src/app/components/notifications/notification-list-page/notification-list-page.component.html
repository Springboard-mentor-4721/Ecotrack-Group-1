<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Notifications</h2>
    <button class="btn btn-outline-primary" (click)="markAllAsRead()"
      [disabled]="isMarkingAll || notifications.length === 0">
      <span *ngIf="isMarkingAll" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      Mark All as Read
    </button>
  </div>

  <div *ngIf="isLoading" class="d-flex justify-content-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && notifications.length === 0" class="text-center py-5 bg-light rounded">
    <lucide-angular [img]="BellIcon" class="text-muted mb-3" style="width: 64px; height: 64px;"></lucide-angular>
    <h4>No Notifications</h4>
    <p class="text-muted">You're all caught up!</p>
  </div>

  <div class="list-group shadow-sm" *ngIf="!isLoading && !errorMessage && notifications.length > 0">
    <div *ngFor="let notification of notifications"
      class="list-group-item list-group-item-action d-flex gap-3 py-3 transition-all cursor-pointer"
      [class.bg-light]="!notification.isRead" (click)="markAsRead(notification)">

      <!-- Icon -->
      <div class="d-flex align-items-center justify-content-center rounded-circle" style="width: 48px; height: 48px;"
        [ngClass]="{
             'bg-primary text-white': notification.type === 'CHALLENGE',
             'bg-success text-white': notification.type === 'GOAL',
             'bg-warning text-dark': notification.type === 'BADGE' || notification.type === 'LEVEL_UP',
             'bg-secondary text-white': notification.type !== 'CHALLENGE' && notification.type !== 'GOAL' && notification.type !== 'BADGE' && notification.type !== 'LEVEL_UP'
           }">
        <lucide-angular [img]="getIconForType(notification.type)" size="24"></lucide-angular>
      </div>

      <!-- Content -->
      <div class="d-flex gap-2 w-100 justify-content-between">
        <div>
          <h6 class="mb-1" [class.fw-bold]="!notification.isRead">{{ notification.title }}</h6>
          <p class="mb-1 text-muted">{{ notification.message }}</p>
          <small class="text-muted">{{ notification.createdAt | date:'medium' }}</small>
        </div>

        <!-- Status indicator -->
        <div class="d-flex align-items-center">
          <span *ngIf="!notification.isRead" class="badge bg-primary rounded-pill"
            style="width: 10px; height: 10px; padding: 0;"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <nav *ngIf="totalPages > 1 && !isLoading && !errorMessage" class="mt-4" aria-label="Notifications pagination">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 0">
        <button class="page-link" (click)="onPageChange(currentPage - 1)"
          [disabled]="currentPage === 0">Previous</button>
      </li>
      <li class="page-item disabled">
        <span class="page-link">Page {{ currentPage + 1 }} of {{ totalPages }}</span>
      </li>
      <li class="page-item" [class.disabled]="currentPage >= totalPages - 1">
        <button class="page-link" (click)="onPageChange(currentPage + 1)"
          [disabled]="currentPage >= totalPages - 1">Next</button>
      </li>
    </ul>
  </nav>
</div>
