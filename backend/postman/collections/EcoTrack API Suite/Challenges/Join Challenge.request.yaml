$kind: http-request
method: POST
url: "{{baseUrl}}/api/challenges/1/join"
headers:
  - key: Authorization
    value: Bearer {{jwtToken}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201, 204]);
      });
