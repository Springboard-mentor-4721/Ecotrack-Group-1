<div class="position-relative overflow-hidden mb-5 rounded-4 shadow-sm group" 
     [style.background]="'url(' + ($any(challenge).imageUrl | challengeImage: $any(challenge).id) + ') center/cover'" 
     style="min-height: 380px;"
     role="img"
     [attr.aria-label]="challenge.title + ' cover banner'">
  <!-- Gradient overlay -->
  <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(90deg, rgba(2,44,34,1) 0%, rgba(2,44,34,0.95) 45%, rgba(6,78,59,0) 100%);"></div>
  
  <div class="position-absolute top-0 start-0 m-4 z-2">
    <button (click)="backClicked.emit()" class="btn bg-white text-dark border-0 rounded-pill px-4 py-2 shadow fw-bold fs-sm d-flex align-items-center gap-2 transition-transform hover-translate-up">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Challenges
    </button>
  </div>

  <div class="position-absolute top-0 end-0 m-4 z-2">
     <button [routerLink]="['/leaderboard']" [queryParams]="{ challengeId: challenge.id }" class="btn bg-white text-dark border-0 rounded-pill px-4 py-2 shadow fw-bold fs-sm d-flex align-items-center gap-2 transition-transform hover-translate-up">
       <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10l1 7H6l1-7zM7 4c0 1 1 3 1 3s1-2 1-3M17 4c0 1-1 3-1 3s-1-2-1-3"></path></svg> View Leaderboard
     </button>
  </div>

  <!-- Content -->
  <div class="position-absolute bottom-0 start-0 w-100 p-4 p-md-5 z-1 d-flex flex-column justify-content-end" style="height: 100%;">
    <div class="d-flex flex-wrap gap-2 mb-3">
      <span class="badge bg-emerald text-white px-3 py-2 rounded-pill fs-xs fw-bolder tracking-wide shadow-sm text-uppercase">
        {{ challenge.typeCode }}
      </span>
      <span class="badge bg-white text-dark px-3 py-2 rounded-pill fs-xs fw-bolder tracking-wide shadow-sm text-uppercase d-flex align-items-center gap-1" *ngIf="challenge.challengeEvaluationType === 'BUDGET'">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg> STAY UNDER BUDGET
      </span>
    </div>
    
    <h1 class="fw-bolder fs-1 mb-3 text-white tracking-tight" style="font-size: 3rem !important;">{{ challenge.title }}</h1>
    <p class="text-white opacity-75 fs-5 mb-4 max-w-3xl lh-base">{{ challenge.description }}</p>
    
    <div class="d-flex flex-wrap gap-4 align-items-center mt-2">
      <div class="d-flex align-items-center gap-2">
        <div class="bg-orange bg-opacity-25 text-orange rounded p-2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </div>
        <div>
          <span class="text-white opacity-50 fs-xs fw-bolder d-block text-uppercase tracking-wide">Reward</span>
          <span class="text-white fw-bold fs-5">{{ challenge.rewardXp }} XP</span>
        </div>
      </div>
      <div style="width: 1px; height: 40px; background-color: rgba(255,255,255,0.2);"></div>
      <div class="d-flex align-items-center gap-2">
        <div class="bg-blue bg-opacity-25 text-blue rounded p-2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <div>
          <span class="text-white opacity-50 fs-xs fw-bolder d-block text-uppercase tracking-wide">Ends In</span>
          <span class="text-white fw-bold fs-5">{{ daysRemaining }} Days</span>
        </div>
      </div>
    </div>
  </div>
</div>
