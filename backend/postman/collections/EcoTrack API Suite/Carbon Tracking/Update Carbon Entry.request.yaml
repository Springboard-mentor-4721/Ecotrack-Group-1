$kind: http-request
method: PUT
url: '{{baseUrl}}/api/carbon/:id'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{jwtToken}}'
pathVariables:
  - key: id
    value: '{{carbonEntryId}}'
body:
  type: json
  content: |-
    {
      "categoryId": 1,
      "subType": "car",
      "quantity": 18.2,
      "unit": "km",
      "entryDate": "2026-07-14",
      "notes": "Updated commute"
    }
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is success', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 403, 404]);
      });

      pm.test('Response time is under 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      const contentType = (pm.response.headers.get('Content-Type') || '').toLowerCase();
      if (contentType.includes('application/json')) {
        const json = pm.response.json();
        if (pm.response.code === 200) {
          pm.test('Updated entry id is present', function () {
            pm.expect(json.id).to.exist;
          });
        } else {
          pm.test('Error response contains message', function () {
            pm.expect(json.message || (json.errors && json.errors.error)).to.exist;
          });
        }
      }
