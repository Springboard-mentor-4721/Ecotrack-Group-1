$kind: http-request
method: POST
url: "{{baseUrl}}/api/auth/login"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "test@example.com",
      "password": "wrongpassword"
    }
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 401', function () {
        pm.expect(pm.response.code).to.eql(401);
      });
