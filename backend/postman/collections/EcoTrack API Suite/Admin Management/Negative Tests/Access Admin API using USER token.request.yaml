$kind: http-request
url: "{{baseUrl}}/api/admin/users"
method: GET
headers:
  Authorization: Bearer {{userToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403 Forbidden', function () {
        pm.expect(pm.response.code).to.eql(403);
      });
    language: text/javascript
order: 1000
