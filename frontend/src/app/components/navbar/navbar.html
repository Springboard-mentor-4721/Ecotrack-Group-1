<nav class="top-navbar bg-surface border-bottom px-4">
  <div class="navbar-content d-flex align-items-center justify-content-between h-100">

    <!-- BRAND & HAMBURGER -->
    <div class="d-flex align-items-center gap-3">
      <button class="icon-btn border-0 bg-transparent p-0 text-dark" (click)="toggleSidebar.emit()" aria-label="Toggle Sidebar" style="cursor: pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="navbar-brand d-flex align-items-center gap-2">
        <img src="/logo.png" alt="EcoTrack Logo" style="width: 28px; height: 28px; object-fit: contain;">
        <span class="fw-bold fs-5 text-dark">EcoTrack</span>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="navbar-actions d-flex align-items-center gap-3 ms-auto">

      <!-- Theme Toggle -->
      <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
        <div class="toggle-track">
          <div class="toggle-thumb" [class.dark]="isDark()">
            <svg *ngIf="!isDark()" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg *ngIf="isDark()" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </div>
        </div>
      </button>

      <div class="divider d-none d-sm-block"></div>

      <!-- Notifications -->
      <app-notification-bell *ngIf="!isAdminUser()"></app-notification-bell>

      <div class="divider d-none d-sm-block"></div>

      <!-- User Profile Dropdown -->
      <div class="position-relative">
        <button class="profile-btn d-flex align-items-center gap-2 border-0 bg-transparent p-0 ms-2" (click)="toggleMenu()">
          <div class="avatar bg-emerald-light text-emerald fw-bold rounded-circle d-flex align-items-center justify-content-center overflow-hidden position-relative">
            <img *ngIf="userProfile()?.profilePictureUrl"
                 [src]="resolveImageUrl(userProfile().profilePictureUrl)"
                 (error)="userProfile().profilePictureUrl = undefined"
                 alt=""
                 class="w-100 h-100" style="object-fit: cover; display: block;">
            <span *ngIf="!userProfile()?.profilePictureUrl">
              {{ userProfile()?.name?.charAt(0)?.toUpperCase() || 'U' }}
            </span>
          </div>
          <div class="d-none d-sm-flex flex-column align-items-start text-start">
            <div class="d-flex align-items-center gap-1">
              <span class="fs-7 fw-bold text-dark lh-1">{{ userProfile()?.name || 'User' }}</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
        </button>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu dropdown-menu-end shadow-sm border rounded-3 position-absolute end-0 mt-2 py-2 bg-surface" style="min-width: 200px;" [class.show]="isMenuOpen()">
          <a [routerLink]="isAdminUser() ? '/admin/settings' : '/profile'" class="dropdown-item px-3 py-2 border-bottom mb-2 text-decoration-none" (click)="toggleMenu()">
            <span class="d-block fw-bold text-dark fs-7">{{ userProfile()?.name || 'User' }}</span>
            <span class="d-block text-muted fs-xs">{{ userProfile()?.email || 'user@ecotrack.com' }}</span>
          </a>
          <button class="dropdown-item d-flex align-items-center gap-2 fs-7 text-danger logout-btn" (click)="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Logout
          </button>
        </div>
      </div>

    </div>
  </div>
</nav>
