$kind: http-request
url: "{{baseUrl}}/api/carbon/:id"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
pathVariables:
  id: "999999"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () {
        pm.expect(pm.response.code).to.eql(404);
      });
    language: text/javascript
order: 3000
