<div class="app-sidebar bg-surface border-end d-flex flex-column">


  <!-- NAVIGATION -->
  <div class="sidebar-nav px-3 flex-grow-1 overflow-y-auto mt-2">

    <!-- WORKSPACE -->
    <div class="nav-section mb-4" *ngIf="!isAdmin">
      <span class="nav-section-title px-3 mb-2 d-block">WORKSPACE</span>
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/dashboard'" [class.disabled-link]="isSuspended"
            routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="2"></rect>
              <rect x="14" y="3" width="7" height="7" rx="2"></rect>
              <rect x="14" y="14" width="7" height="7" rx="2"></rect>
              <rect x="3" y="14" width="7" height="7" rx="2"></rect>
            </svg>
            <span class="flex-grow-1">Dashboard</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/carbon-tracker'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
              <path d="M2 22 12 12"></path>
            </svg>
            <span class="flex-grow-1">Carbon Journal</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/goals'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="6"></circle>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
            <span class="flex-grow-1">Goals</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/challenges'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span class="flex-grow-1">Challenges</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/leaderboard'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span class="flex-grow-1">Leaderboard</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/achievements'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
              </polygon>
            </svg>
            <span class="flex-grow-1">Achievements</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/recommendations'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 16v-4"></path>
              <path d="M12 8h.01"></path>
            </svg>
            <span class="flex-grow-1">Recommendations</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/reports'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"></path>
              <path d="M18 9l-5 5-3-3-4 4"></path>
            </svg>
            <span class="flex-grow-1">Reports</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
      </ul>
    </div>

    <!-- ADMINISTRATION -->
    <div class="nav-section mb-4" *ngIf="isAdmin">
      <span class="nav-section-title px-3 mb-2 d-block">ADMINISTRATION</span>
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/dashboard'" [class.disabled-link]="isSuspended" routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            <span class="flex-grow-1">Dashboard</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/challenges'"
            [class.disabled-link]="isSuspended" routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span class="flex-grow-1">Challenges</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/badges'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="7"></circle>
              <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
            </svg>
            <span class="flex-grow-1">Gamification</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/users'" [class.disabled-link]="isSuspended" routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span class="flex-grow-1">Users</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
      </ul>
    </div>

    <!-- ACCOUNT -->
    <div class="nav-section mb-4">
      <span class="nav-section-title px-3 mb-2 d-block">ACCOUNT</span>
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/profile" routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="flex-grow-1">Profile</span>
          </a>
        </li>

      </ul>
    </div>
  </div>

  <div class="sidebar-footer px-3 pb-4">
    <!-- Promo Banner -->
    <div class="promo-banner bg-emerald-light rounded-4 p-3 mb-3 position-relative overflow-hidden">
      <div class="position-relative z-1">
        <span class="fw-bold fs-7 text-emerald d-block mb-1">Building a</span>
        <span class="fw-bold fs-6 text-emerald d-block mb-3">greener future</span>
      </div>
      <svg class="position-absolute end-0 bottom-0 text-emerald opacity-25" style="transform: translate(20%, 20%);"
        width="80" height="80" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 22C12 22 20 18 20 12C20 6 12 2 12 2C12 2 4 6 4 12C4 18 12 22 12 22Z" />
      </svg>
    </div>

    <button class="nav-link w-100 d-flex align-items-center gap-3 px-3 py-2 border-0 bg-transparent text-danger"
      (click)="logout()">
      <svg class="nav-icon text-danger" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="fw-600 text-danger">Log Out</span>
    </button>
  </div>
</div>
