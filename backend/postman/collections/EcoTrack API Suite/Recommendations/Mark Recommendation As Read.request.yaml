$kind: http-request
method: PUT
url: "{{baseUrl}}/api/recommendations/1/read"
headers:
  - key: Authorization
    value: Bearer {{jwtToken}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
