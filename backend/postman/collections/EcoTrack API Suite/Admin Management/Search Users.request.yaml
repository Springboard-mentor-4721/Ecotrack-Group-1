$kind: http-request
url: "{{baseUrl}}/api/admin/users?search=john"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
queryParams:
  search: john
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.eql(200);
      });
    language: text/javascript
order: 4000
