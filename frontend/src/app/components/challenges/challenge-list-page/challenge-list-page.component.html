<div class="challenges-wrapper animate-page px-4 py-4 max-w-7xl mx-auto">
  
  <app-explore-page-header></app-explore-page-header>

  <!-- Filter Bar -->
  <div class="bg-white rounded-4 shadow-sm p-3 mb-4">
    <app-challenge-search-input 
      [searchText]="searchQuery" 
      [isLoading]="isLoading"
      (searchTextChange)="onSearchChange($event)">
    </app-challenge-search-input>

    <app-challenge-filter-bar
      [isLoading]="isLoading"
      [evaluationFilter]="evaluationFilter"
      [trackingFilter]="trackingFilter"
      [sortFilter]="sortFilter"
      (evaluationFilterChange)="setEvaluationFilter($event)"
      (trackingFilterChange)="setTrackingFilter($event)"
      (sortFilterChange)="setSortFilter($event)">
    </app-challenge-filter-bar>
  </div>

  <app-results-count [count]="filteredChallenges.length"></app-results-count>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="row g-4 mb-5">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let i of [1,2,3,4,5,6]">
      <app-loading-skeleton type="card"></app-loading-skeleton>
    </div>
  </div>

  <!-- Empty State -->
  <app-empty-state *ngIf="!isLoading && filteredChallenges.length === 0"
                   (clearFilters)="clearSearch(); setEvaluationFilter('ALL'); setTrackingFilter('ALL'); setSortFilter('newest')"
                   (browseAll)="loadChallenges()">
  </app-empty-state>

  <!-- Grid -->
  <div *ngIf="!isLoading && filteredChallenges.length > 0">
    <div class="row g-4 mb-5">
      <div class="col-12 col-md-6 col-lg-4 animate-stagger-item" *ngFor="let challenge of filteredChallenges; let i = index">
        <app-challenge-card [challenge]="challenge" 
                            [index]="i" 
                            [isUrgent]="isUrgent(challenge.endDate)" 
                            [isWarning]="isWarning(challenge.endDate)">
        </app-challenge-card>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <app-pagination-control *ngIf="totalPages > 1"
                          [currentPage]="currentPage"
                          [totalPages]="totalPages"
                          [isLoading]="isLoading"
                          (previous)="prevPage()"
                          (next)="nextPage()">
  </app-pagination-control>
</div>
