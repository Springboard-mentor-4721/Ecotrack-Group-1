$kind: http-request
method: POST
url: "{{baseUrl}}/api/carbon"
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{jwtToken}}
body:
  type: json
  content: |-
    {
      "categoryId": 1,
      "subType": "car",
      "quantity": -5,
      "unit": "km",
      "entryDate": "2026-07-14"
    }
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 400', function () {
        pm.expect(pm.response.code).to.eql(400);
      });
