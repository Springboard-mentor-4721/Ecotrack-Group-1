$kind: http-request
method: GET
url: '{{baseUrl}}/api/carbon/summary'
headers:
  - key: Authorization
    value: 'Bearer {{jwtToken}}'
queryParams:
  - key: startDate
    value: '2026-01-01'
  - key: endDate
    value: '2026-12-31'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.eql(200);
      });

      pm.test('Response time is under 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      const contentType = (pm.response.headers.get('Content-Type') || '').toLowerCase();
      pm.test('Response content type is JSON', function () {
        pm.expect(contentType).to.include('application/json');
      });

      const json = pm.response.json();
      pm.test('Summary response contains totalEmission', function () {
        pm.expect(json.totalEmission).to.not.equal(undefined);
      });
      pm.test('Summary response contains categorySummaries array', function () {
        pm.expect(json.categorySummaries).to.be.an('array');
      });
