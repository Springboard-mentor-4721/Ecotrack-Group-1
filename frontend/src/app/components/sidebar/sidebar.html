<div class="app-sidebar bg-surface border-end d-flex flex-column">

  <!-- SIDEBAR HEADER — mobile only (hidden on lg+) -->
  <div class="sidebar-header px-3 d-flex d-lg-none align-items-center justify-content-between">
    <!-- Brand -->
    <div class="d-flex align-items-center gap-2">
      <img src="/logo.png" alt="EcoTrack Logo" style="width:28px; height:28px; object-fit:contain;">
      <span class="fw-bold fs-5" style="letter-spacing:-0.02em; color:var(--text-primary);">EcoTrack</span>
    </div>
    <!-- Close button -->
    <button class="sidebar-close-btn" (click)="closeRequest.emit()" aria-label="Close sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- NAVIGATION -->
  <div class="sidebar-nav px-3 flex-grow-1 overflow-y-auto mt-2">

    <!-- WORKSPACE -->
    <div class="nav-section mb-1" *ngIf="!isAdmin">

      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/dashboard'" [class.disabled-link]="isSuspended"
            routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="2"></rect>
              <rect x="14" y="3" width="7" height="7" rx="2"></rect>
              <rect x="14" y="14" width="7" height="7" rx="2"></rect>
              <rect x="3" y="14" width="7" height="7" rx="2"></rect>
            </svg>
            <span class="flex-grow-1">Dashboard</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/carbon-tracker'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
              <path d="M2 22 12 12"></path>
            </svg>
            <span class="flex-grow-1">Carbon Journal</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/goals'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="6"></circle>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
            <span class="flex-grow-1">Goals</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/challenges'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
              <line x1="13" y1="19" x2="19" y2="13"></line>
              <line x1="16" y1="16" x2="20" y2="20"></line>
              <line x1="19" y1="21" x2="21" y2="19"></line>
              <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"></polyline>
              <line x1="5" y1="14" x2="9" y2="18"></line>
              <line x1="7" y1="17" x2="4" y2="20"></line>
              <line x1="3" y1="19" x2="5" y2="21"></line>
            </svg>
            <span class="flex-grow-1">Challenges</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/leaderboard'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span class="flex-grow-1">Leaderboard</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/achievements'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
              <path d="M4 22h16"></path>
              <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
              <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
            <span class="flex-grow-1">Achievements</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/recommendations'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <!-- Rounded square -->
              <path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6"></path>
              <!-- A -->
              <path d="M7 16l2.5-7 2.5 7"></path>
              <path d="M8.5 13.5h3"></path>
              <!-- i -->
              <path d="M14 16v-4"></path>
              <circle cx="14" cy="9" r="1" fill="currentColor" stroke="none"></circle>
              <!-- Sparkle -->
              <path d="M18 2l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="currentColor" stroke="none"></path>
            </svg>
            <span class="flex-grow-1">AI Recommendations</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/reports'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M7 10h10"></path>
              <path d="M7 14h10"></path>
              <path d="M7 18h10"></path>
              <path d="M13 14l2-2 2 2" stroke-width="1.5"></path>
              <circle cx="9" cy="15" r="2" stroke-width="1.5"></circle>
            </svg>
            <span class="flex-grow-1">Reports & Analytics</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
      </ul>
    </div>

    <!-- ADMINISTRATION -->
    <div class="nav-section mb-1" *ngIf="isAdmin">

      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/dashboard'" [class.disabled-link]="isSuspended" routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            <span class="flex-grow-1">Dashboard</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/challenges'"
            [class.disabled-link]="isSuspended" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
              <line x1="13" y1="19" x2="19" y2="13"></line>
              <line x1="16" y1="16" x2="20" y2="20"></line>
              <line x1="19" y1="21" x2="21" y2="19"></line>
              <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"></polyline>
              <line x1="5" y1="14" x2="9" y2="18"></line>
              <line x1="7" y1="17" x2="4" y2="20"></line>
              <line x1="3" y1="19" x2="5" y2="21"></line>
            </svg>
            <span class="flex-grow-1">Challenges</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/badges'" [class.disabled-link]="isSuspended"
            routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="7"></circle>
              <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
            </svg>
            <span class="flex-grow-1">Gamification</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/users'" [class.disabled-link]="isSuspended" routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span class="flex-grow-1">Users</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isSuspended ? null : '/admin/challenges/analytics'" [class.disabled-link]="isSuspended" routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span class="flex-grow-1">Analytics</span>
            <i class="bi bi-lock-fill ms-auto text-muted" *ngIf="isSuspended"></i>
          </a>
        </li>
      </ul>
    </div>

    <!-- ACCOUNT -->
    <div class="nav-section mb-1">

      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="isAdmin ? '/admin/settings' : '/profile'" routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="flex-grow-1">Profile & Settings</span>
          </a>
        </li>

      </ul>
    </div>
  </div>

  <div class="sidebar-footer px-3 pb-4">
    <!-- Promo Banner -->
    <div class="promo-banner bg-emerald-light rounded-4 p-3 mb-3 position-relative overflow-hidden">
      <div class="position-relative z-1">
        <span class="fw-bold fs-7 text-emerald d-block mb-1">Building a</span>
        <span class="fw-bold fs-6 text-emerald d-block mb-3">greener future</span>
      </div>
      <svg class="position-absolute end-0 bottom-0 text-emerald opacity-25" style="transform: translate(20%, 20%);"
        width="80" height="80" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 22C12 22 20 18 20 12C20 6 12 2 12 2C12 2 4 6 4 12C4 18 12 22 12 22Z" />
      </svg>
    </div>

    <button class="nav-link w-100 d-flex align-items-center gap-3 px-3 py-2 border-0 bg-transparent text-danger"
      (click)="logout()">
      <svg class="nav-icon text-danger" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="fw-600 text-danger">Log Out</span>
    </button>
  </div>
</div>
