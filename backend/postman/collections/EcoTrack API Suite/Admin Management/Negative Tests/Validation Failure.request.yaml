$kind: http-request
method: PUT
url: '{{baseUrl}}/api/admin/users/{{userId}}/status'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{jwtToken}}'
body:
  type: json
  content: |-
    {
      "status": null
    }
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 400 Bad Request', function () {
        pm.expect(pm.response.code).to.eql(400);
      });
