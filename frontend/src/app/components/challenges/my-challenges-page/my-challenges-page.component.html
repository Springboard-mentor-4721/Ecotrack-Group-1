<div class="container-fluid py-4 py-md-5 my-challenges-container">
  
  <app-my-challenges-header (exploreClicked)="exploreClicked()"></app-my-challenges-header>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="mb-5">
    <app-loading-skeleton type="card"></app-loading-skeleton>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage && !isLoading" class="alert alert-danger rounded-4 d-flex align-items-center border-0 shadow-sm p-4 mb-4" role="alert">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-3 flex-shrink-0">
      <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <div class="flex-grow-1">
      <h4 class="h6 fw-bold mb-1">We couldn't load your challenges</h4>
      <p class="fs-sm mb-0">{{ errorMessage }}</p>
    </div>
    <button class="btn btn-outline-danger btn-sm rounded-pill px-3" (click)="loadMyChallenges()">Try Again</button>
  </div>

  <div *ngIf="!isLoading && !errorMessage">
    <app-my-challenges-tab-bar 
      [tabs]="tabs" 
      [currentTab]="currentTab" 
      (tabSelected)="setTab($event)">
    </app-my-challenges-tab-bar>

    <!-- Tab Panels -->
    <div class="tab-content">
      <div class="tab-pane fade show active" role="tabpanel" [id]="'tabpanel-' + currentTab" [attr.aria-labelledby]="'tab-' + currentTab">
        
        <!-- Empty State -->
        <app-my-challenges-empty-state 
          *ngIf="filteredChallenges.length === 0"
          [currentTab]="currentTab"
          (exploreClicked)="exploreClicked()">
        </app-my-challenges-empty-state>

        <!-- Cards List -->
        <div *ngIf="filteredChallenges.length > 0" class="row g-4">
          <div class="col-12 col-lg-6" *ngFor="let entry of filteredChallenges">
            <app-my-challenge-card 
              [entry]="entry"
              (cardClicked)="onCardClick($event)">
            </app-my-challenge-card>
          </div>
        </div>

      </div>
    </div>
    
  </div>
</div>
