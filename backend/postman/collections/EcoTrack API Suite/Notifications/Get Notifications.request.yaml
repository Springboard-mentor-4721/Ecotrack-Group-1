$kind: http-request
url: "{{baseUrl}}/api/notifications"
method: GET
headers:
  Authorization: Bearer {{jwtToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
    language: text/javascript
order: 1000
