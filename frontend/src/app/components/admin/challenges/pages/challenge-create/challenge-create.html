<div class="create-container">
  
  <!-- Global Loading & Messages -->
  <div *ngIf="isLoading" class="global-overlay">
    <div class="spinner">Loading challenge data...</div>
  </div>
  
  <div class="messages-container" *ngIf="successMessage || errorMessage">
    <div class="message success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </div>

  <div class="workspace-left" *ngIf="workflowState === 'GALLERY' && !isLoading">
    <app-template-gallery 
      [templates]="templates" 
      [selectedTemplate]="selectedTemplate"
      (templateSelected)="onTemplateSelected($event)">
    </app-template-gallery>
  </div>

  <div class="workspace-left" *ngIf="workflowState === 'CONFIG' && !isLoading">
    <div class="header">
      <h1>{{ isEditing ? 'Edit Campaign' : 'Configure Campaign' }}</h1>
      <p>Configure your campaign settings and rules.</p>
    </div>

    <app-challenge-config
      [challengeForm]="challengeForm"
      [categories]="categories"
      [supportsRules]="supportsRules"
      [supportsInstructions]="supportsInstructions"
      (categoryChanged)="onCategoryChanged($event)">
    </app-challenge-config>

    <!-- Rule Builder -->
    <div class="section mt-3" style="margin-top: 16px;" *ngIf="supportsRules">
      <h2 class="section-title">Activity Rules</h2>
      <app-rule-builder
        [availableSubcategories]="availableSubcategories"
        [allowedSubcategories]="allowedSubcategories"
        [blockedSubcategories]="blockedSubcategories"
        (allowedChanged)="onAllowedRulesChanged($event)"
        (blockedChanged)="onBlockedRulesChanged($event)">
      </app-rule-builder>
    </div>

    <div class="action-bar">
      <button class="btn-secondary" (click)="cancelCreation()" [disabled]="isSaving">Cancel</button>
      <button class="btn-primary" (click)="saveCampaign()" [disabled]="isSaving || challengeForm.invalid">
        <span *ngIf="isSaving">Saving...</span>
        <span *ngIf="!isSaving">{{ isEditing ? 'Save Changes' : 'Publish Campaign' }}</span>
      </button>
    </div>
  </div>

  <div class="workspace-right" *ngIf="workflowState === 'CONFIG' && !isLoading">
    <h3 class="preview-header">Live Preview</h3>
    <app-campaign-preview 
      [challengeForm]="challengeForm"
      [selectedTemplate]="selectedTemplate">
    </app-campaign-preview>
  </div>
</div>
