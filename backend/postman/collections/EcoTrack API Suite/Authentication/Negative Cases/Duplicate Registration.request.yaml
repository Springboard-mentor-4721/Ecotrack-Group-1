$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "test@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400', function () {
        pm.expect(pm.response.code).to.eql(400);
      });
    language: text/javascript
order: 2000
