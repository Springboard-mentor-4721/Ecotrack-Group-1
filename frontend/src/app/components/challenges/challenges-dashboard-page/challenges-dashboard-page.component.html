<div class="container-fluid pt-2 pb-4 pt-md-3 pb-md-5">

  <div *ngIf="isLoading()" class="mb-5">
    <app-loading-skeleton type="card"></app-loading-skeleton>
  </div>

  <div *ngIf="!isLoading()">

    <!-- Hero Section -->
    <app-dashboard-hero
      [activeChallengesCount]="myActiveChallenges().length"
      [completedCount]="myCompletedChallenges().length">
    </app-dashboard-hero>

    <!-- Urgency Alerts -->
    <app-urgency-alert-banner
      [alerts]="urgencyAlerts()">
    </app-urgency-alert-banner>

    <!-- Quick Actions (with Total XP) -->
    <app-dashboard-quick-actions [totalXp]="totalXpEarned()"></app-dashboard-quick-actions>

    <!-- Active Challenges Placeholder -->
    <div class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 fw-bold mb-0">Continue Your Challenges</h2>
        <a [routerLink]="['/challenges/my']" class="text-primary text-decoration-none fw-bold fs-sm d-inline-flex align-items-center group">
          View All
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="ms-1 transition-transform group-hover:translate-x-1" style="transition: transform 0.2s ease;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
      </div>

      <div *ngIf="myActiveChallenges().length === 0" class="bg-surface rounded-4 p-5 text-center border shadow-sm">
        <div class="bg-slate-200 text-slate-400 mx-auto rounded-circle d-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        </div>
        <h3 class="fw-bold fs-5 mb-2">No active challenges</h3>
        <p class="text-muted fs-sm mb-4 max-w-sm mx-auto">You aren't participating in any challenges right now. Explore available challenges to get started!</p>
        <a [routerLink]="['/challenges/explore']" class="btn btn-primary px-4 py-2 rounded-pill fw-bold">Explore Challenges</a>
      </div>

      <div *ngIf="myActiveChallenges().length > 0" class="mb-4">
        <div class="row row-cols-1 row-cols-lg-2 g-3">
          <div class="col" *ngFor="let entry of myActiveChallenges()">
            <app-my-challenge-card
              [entry]="entry"
              [compact]="true"
              (cardClicked)="onChallengeClick($event)">
            </app-my-challenge-card>
          </div>
        </div>
      </div>
    </div>

    <!-- Recommended Challenges Placeholder -->
    <div class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 fw-bold mb-0 d-flex align-items-center gap-2">
          Recommended For You
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill fs-xs px-2 py-1 d-flex align-items-center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
            AI Pick
          </span>
        </h2>
        <a [routerLink]="['/challenges/explore']" class="text-primary text-decoration-none fw-bold fs-sm d-inline-flex align-items-center group">
          Explore All
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="ms-1 transition-transform group-hover:translate-x-1" style="transition: transform 0.2s ease;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
      </div>

      <div class="mb-4 row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        <div class="col" *ngFor="let challenge of recommendedChallenges()">
          <app-challenge-card [challenge]="challenge"></app-challenge-card>
        </div>
      </div>
    </div>



  </div>
</div>
