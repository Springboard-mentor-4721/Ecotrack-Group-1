$kind: http-request
name: 'Auth Register'
method: POST
url: '{{base_url}}/api/auth/register'
order: 1000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "{{registerEmail}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: 'text/javascript'
    code: |-
      pm.test('Status is 201 Created', function () {
        pm.response.to.have.status(201);
      });

      pm.test('Registration success message is returned', function () {
        pm.expect(pm.response.text()).to.eql('User registered successfully');
      });
