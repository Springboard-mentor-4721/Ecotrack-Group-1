<div class="summary-banner p-4 p-md-5 mb-5 position-relative overflow-hidden group">
  <!-- Background Pattern / Decoration -->
  <div class="position-absolute top-0 start-0 w-100 h-100 banner-bg"></div>
  
  <div class="position-relative z-1">
    <div class="d-flex align-items-center gap-3 mb-5">
      <div class="bg-emerald-light rounded-circle p-2 icon-glow-success d-inline-flex">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald">
          <path d="M12 20V10"></path>
          <path d="M18 20V4"></path>
          <path d="M6 20v-4"></path>
        </svg>
      </div>
      <h3 class="fw-bolder fs-3 mb-0 text-primary tracking-tight">Your Impact Summary</h3>
    </div>
    
    <div class="row g-4">
      <!-- Stat 1: Total Completed -->
      <div class="col-12 col-md-4">
        <div class="glass-stat-card h-100 d-flex flex-column justify-content-between">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="fs-xs fw-bold text-uppercase tracking-wider text-muted">Challenges Conquered</span>
            <div class="bg-emerald bg-opacity-25 rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
          </div>
          <div class="mt-auto">
            <span class="display-5 fw-black text-primary d-block lh-1">{{ totalCompleted | number }}</span>
          </div>
        </div>
      </div>
      
      <!-- Stat 2: Total XP Earned -->
      <div class="col-12 col-md-4">
        <div class="glass-stat-card h-100 d-flex flex-column justify-content-between position-relative overflow-hidden">
          <div class="position-absolute top-0 end-0 p-3 opacity-25">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="text-emerald"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
          <div class="d-flex justify-content-between align-items-start mb-3 position-relative z-1">
            <span class="fs-xs fw-bold text-uppercase tracking-wider text-muted">Total XP Earned</span>
          </div>
          <div class="mt-auto position-relative z-1 d-flex align-items-baseline gap-2">
            <span class="display-5 fw-black text-gradient lh-1 icon-glow-xp">+{{ totalXpEarned | number }}</span>
            <span class="fs-6 fw-bold text-emerald opacity-75">XP</span>
          </div>
        </div>
      </div>
      
      <!-- Stat 3: Total Not Achieved -->
      <div class="col-12 col-md-4">
        <div class="glass-stat-card h-100 d-flex flex-column justify-content-between">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="fs-xs fw-bold text-uppercase tracking-wider text-muted">Not Achieved</span>
            <div class="bg-danger bg-opacity-25 rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-danger"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
            </div>
          </div>
          <div class="mt-auto">
            <span class="display-5 fw-black text-primary d-block lh-1">{{ totalFailed | number }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
